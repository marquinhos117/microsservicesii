spring.application.name=pedido-service
server.port=8083

# Conexao com SQLite isolado
spring.datasource.url=jdbc:sqlite:pedido_database.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialeto do Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# URLs dos Microsservicos dependentes para comunicacao via RestClient
cliente.service.url=http://localhost:8081
estoque.service.url=http://localhost:8082

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
